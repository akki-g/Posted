services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: posted
      POSTGRES_USER: posted
      POSTGRES_PASSWORD: posted-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posted -d posted"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - posted_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_SECRET: ${APP_SECRET:-compose-dev-only-change-me}
      DATABASE_URL: postgresql+asyncpg://posted:posted-local@postgres:5432/posted
      DEMO_MODE: "true"
      FRONTEND_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8000:8000"

volumes:
  posted_postgres:
