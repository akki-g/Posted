# Production deployment. Uses the same root .env as local dev and
# docker-compose.yml -- Compose auto-loads .env from the project directory,
# no --env-file flag needed. Local dev still works off the same file; only
# APP_ENV/DATABASE_URL/DEMO_MODE are forced below regardless of what .env has.
#
# Before running this on the EC2 host:
#   1. `docker network create portfolio-edge` (once, shared with the other apps
#      behind the same reverse proxy) -- skip this if it already exists.
#   2. Add POSTGRES_PASSWORD=<a long random value> to .env -- it's new, this
#      repo didn't need it before Postgres was added for production.
#   3. Update these existing .env values from their localhost dev defaults to
#      your real deployed domain: FRONTEND_ORIGINS, FRONTEND_APP_URL,
#      FRONTEND_LOGIN_CALLBACK_URL, GOOGLE_REDIRECT_URI, SCHWAB_REDIRECT_URI.
#      Google/Schwab's own registered redirect URIs must match exactly.
#   4. One nginx server block added in the personal-portfolio repo's edge proxy
#      config routing your Posted domain to `posted-web:8080` -- not this repo.
#
#   docker compose -f compose.production.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posted
      POSTGRES_USER: posted
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posted -d posted"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - posted_postgres_data:/var/lib/postgresql/data
    networks:
      - app

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: postgresql+asyncpg://posted:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/posted
      DEMO_MODE: "false"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  web:
    build:
      context: ./apps/client
      args:
        EXPO_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      app:
      portfolio_edge:
        aliases: [posted-web]

networks:
  app:
  portfolio_edge:
    name: portfolio-edge
    external: true

volumes:
  posted_postgres_data:
